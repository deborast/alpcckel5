<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Belajar - KhodamBelajar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#5E43FF', primaryLight: '#ECE9FF' } } } }</script>
    <style>
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }
        .ring-anim::before { content: ''; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-color: #5E43FF; border-radius: 50%; z-index: -1; animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        html { scroll-behavior: smooth; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #5E43FF; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50 font-sans">

    <div id="customToast" class="fixed top-8 right-8 z-[100] transform translate-x-[150%] transition-transform duration-500 bg-white border-l-4 shadow-2xl rounded-2xl p-5 flex items-start gap-4 w-80">
        <div id="toastIcon" class="p-2 rounded-full"></div>
        <div><h4 id="toastTitle" class="font-bold text-gray-800 text-lg">Berhasil!</h4><p id="toastMessage" class="text-sm text-gray-500 mt-1">Pesan</p></div>
    </div>

    <aside class="w-64 bg-white border-r flex flex-col justify-between h-full shrink-0">
        <div id="tempat-sidebar" class="z-20 shrink-0 h-full"></div>
        <div class="p-4 border-t flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-800 text-white rounded-full flex items-center justify-center font-bold user-photo-display overflow-hidden">?</div>
                <div><p class="text-sm font-bold text-gray-800 user-name-display">Memuat...</p></div>
            </div>
            <button onclick="logoutUser()" class="text-red-500 hover:bg-red-50 p-2 rounded-lg" title="Logout"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></button>
        </div>
    </aside>
    
    <main class="flex-1 flex flex-col h-full overflow-y-auto relative">
        <header class="bg-white px-8 py-4 flex justify-end items-center border-b border-transparent sticky top-0 z-10">
            <div class="w-10 h-10 bg-gray-800 text-white rounded-full flex items-center justify-center font-bold user-photo-display overflow-hidden cursor-pointer" onclick="window.location.href='profil.html'">?</div>
        </header>

        <div class="p-8 h-full max-w-7xl mx-auto w-full">
            <div id="viewTargetList">
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
                    <div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">Target Belajar 🎯</h2>
                        <p class="text-gray-500">Pilih folder target untuk melihat atau membuat materi AI.</p>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 items-center">
                        <div class="relative w-full sm:w-72">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input type="text" id="searchTargetInput" oninput="filterTargetList()" placeholder="Cari folder target..." class="pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:border-primary outline-none w-full shadow-sm transition">
                        </div>
                        <button onclick="bukaModal()" class="bg-primary text-white font-bold px-5 py-2.5 rounded-xl hover:bg-indigo-700 transition shadow-sm whitespace-nowrap w-full sm:w-auto">+ Target Baru</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-h-[560px] overflow-y-auto pr-2 pb-4 custom-scroll" id="containerTargetList"></div>
            </div>

            <div id="viewFolder" class="hidden pb-20">
                <button onclick="kembaliKeTarget()" class="text-gray-500 hover:text-primary mb-6 flex items-center gap-2 font-semibold bg-white px-4 py-2 rounded-full shadow-sm border w-max transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Kembali ke Daftar Target
                </button>
                <div class="bg-white p-8 rounded-2xl shadow-sm border mb-8 border-l-4 border-l-primary">
                    <h2 id="folderJudul" class="text-3xl font-bold text-gray-800 mb-2">Memuat...</h2>
                    <p id="folderDeskripsi" class="text-gray-500">...</p>
                </div>
                
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
                    <h3 class="text-xl font-bold text-gray-800">Modul di dalam Target ini:</h3>
                    <div class="relative w-full sm:w-72">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="searchModulFolderInput" oninput="filterModulFolder()" placeholder="Cari modul di target ini..." class="pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:border-primary outline-none w-full shadow-sm transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-h-[440px] overflow-y-auto pr-2 pb-4 custom-scroll" id="containerModulList"></div>
            </div>

            <div id="viewBaca" class="hidden pb-20">
                <button onclick="kembaliKeFolder()" class="text-gray-500 hover:text-primary mb-8 flex items-center gap-2 font-semibold bg-white px-4 py-2 rounded-full shadow-sm border w-max transition hover:shadow">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Tutup Modul
                </button>
                <div class="bg-gradient-to-r from-primary to-indigo-600 p-10 rounded-3xl shadow-lg mb-10 text-white">
                    <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase mb-4 inline-block">Modul Belajar</span>
                    <h2 id="bacaJudul" class="text-4xl md:text-5xl font-extrabold leading-tight">...</h2>
                </div>
                <div id="bacaKonten" class="w-full"></div>
            </div>
        </div>
    </main>

    <!-- modal crud target -->
    <div id="modalForm" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl">
            <h3 class="text-xl font-bold mb-4" id="modalTitle">Buat Target Belajar</h3>
            <input type="hidden" id="inputId">
            <div class="space-y-4">
                <div><label class="block text-sm text-gray-600 mb-1">Judul Sertifikasi / Target</label><input type="text" id="inputJudul" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary outline-none"></div>
                <div><label class="block text-sm text-gray-600 mb-1">Deskripsi Singkat</label><input type="text" id="inputDeskripsi" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary outline-none"></div>
                <div><label class="block text-sm text-gray-600 mb-1">Tanggal Selesai</label><input type="date" id="inputTanggal" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary outline-none"></div>
            </div>
            <div class="mt-6 flex justify-end gap-3"><button onclick="tutupModal()" class="px-5 py-2 text-gray-600 font-semibold hover:bg-gray-100 rounded-lg">Batal</button><button onclick="simpanData()" class="px-5 py-2 bg-primary text-white font-semibold rounded-lg hover:bg-indigo-700">Simpan</button></div>
        </div>
    </div>

    <div id="modalKhodam" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg p-8 rounded-[2rem] shadow-2xl relative overflow-hidden">
            <div id="formKhodamArea">
                <div class="text-center mb-6"><div class="text-5xl mb-3">🔮</div><h3 class="text-2xl font-bold text-gray-900">Panggil Khodam AI</h3></div>
                <div class="space-y-5">
                    <div><label class="block text-sm font-bold text-gray-700 mb-2">Judul Modul Baru</label><input type="text" id="aiTopik" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:border-primary outline-none"></div>
                    <div class="flex gap-4">
                        <div class="w-1/3"><label class="block text-sm font-bold text-gray-700 mb-2">Jumlah Bab</label><input type="number" id="aiBab" value="5" min="3" max="10" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-center font-bold"></div>
                        <div class="w-2/3"><label class="block text-sm font-bold text-gray-700 mb-2">Upload PDF (Opsional)</label><input type="file" id="aiPdf" onchange="cekFilePdf()" class="w-full text-xs file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-primaryLight file:text-primary bg-gray-50 rounded-full"><button type="button" id="btnHapusPdf" onclick="hapusPdf()" class="hidden absolute right-1 shrink-0 bg-red-100 text-red-500 hover:bg-red-500 hover:text-white p-1.5 rounded-full transition">X</button></div>
                    </div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-2">Fokus Kisi-kisi (Opsional)</label><textarea id="aiKisi" rows="2" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:border-primary outline-none transition"></textarea></div>
                </div>
                <div class="mt-8 flex gap-3"><button onclick="tutupModalKhodam()" class="w-1/3 py-4 text-gray-600 font-bold bg-gray-100 hover:bg-gray-200 rounded-xl transition">Batal</button><button onclick="generateAI()" class="w-2/3 bg-primary text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition">Generate Materi</button></div>
            </div>
            <div id="aiLoadingArea" class="hidden flex-col items-center justify-center py-10">
                <div class="relative w-24 h-24 mb-8 flex justify-center items-center"><div class="ring-anim absolute w-full h-full"></div><div class="text-6xl absolute z-10 animate-bounce">🔮</div></div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">Khodam Bermeditasi</h3><p id="loadingText" class="text-primary font-bold text-lg bg-primaryLight px-4 py-1 rounded-full">Membaca referensi...</p>
            </div>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/target.js"></script>
</body>
</html>
