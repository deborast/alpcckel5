<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - KhodamBelajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#5E43FF' } } } }</script>
</head>
<body class="bg-slate-50 font-sans flex h-screen overflow-hidden">
    
    <main class="flex-1 overflow-y-auto p-8 max-w-2xl mx-auto">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Pengaturan Profil</h2>
        <a href="index.html" class="text-primary hover:underline mb-8 block">&larr; Kembali ke Beranda</a>

        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-6">
            <div class="flex items-center gap-4 border-b pb-6">
                <div class="w-16 h-16 bg-gray-800 text-white rounded-full flex items-center justify-center font-bold text-2xl user-photo-display overflow-hidden">
                </div>
                <div>
                    <h3 class="text-xl font-bold user-name-display">Memuat...</h3>
                    <p class="text-gray-500 text-sm">Akun Terverifikasi</p>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-1">Ubah Nama Tampilan</label>
                <input type="text" id="editNama" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary mb-4">
                
                <label class="block text-sm text-gray-600 mb-1">Ubah Foto Profil (Masukkan Link URL Gambar)</label>
                <input type="url" id="editFotoUrl" placeholder="https://contoh.com/foto.jpg" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary mb-4">
                
                <button id="btnSimpanProfil" class="bg-primary text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Update Profil</button>
            </div>

            <hr>

            <div>
                <h3 class="font-bold text-lg mb-4 text-red-600">Keamanan</h3>
                <label class="block text-sm text-gray-600 mb-1">Password Baru</label>
                <input type="password" id="editPassword" placeholder="Minimal 6 karakter" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:red-500 mb-4">
                
                <button id="btnGantiPassword" class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-700 transition">Ganti Password</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module">
        import { updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { auth } from './js/firebase-config.js';
        document.getElementById('btnSimpanProfil').addEventListener('click', async () => {
            const user = auth.currentUser;
            const namaBaru = document.getElementById('editNama').value;
            const fotoUrlBaru = document.getElementById('editFotoUrl').value;

            if(user) {
                try {
                    await updateProfile(user, {
                        displayName: namaBaru || user.displayName,
                        photoURL: fotoUrlBaru || user.photoURL
                    });
                    alert("Profil berhasil diperbarui!");
                    window.location.reload();
                } catch (error) {
                    alert("Gagal update profil: " + error.message);
                }
            }
        });
        document.getElementById('btnGantiPassword').addEventListener('click', async () => {
            const user = auth.currentUser;
            const passwordBaru = document.getElementById('editPassword').value;

            if(passwordBaru.length < 6) return alert("Password harus minimal 6 karakter!");

            if(user) {
                try {
                    await updatePassword(user, passwordBaru);
                    alert("Password berhasil diubah! Silakan login kembali dengan password baru.");
                    window.logoutUser(); 
                } catch (error) {
                    if(error.code === 'auth/requires-recent-login') {
                        alert("Untuk alasan keamanan, silakan Logout dan Login kembali sebelum mengganti password.");
                    } else {
                        alert("Gagal mengganti password: " + error.message);
                    }
                }
            }
        });
    </script>
</body>
</html>
